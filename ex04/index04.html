<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>ex04</title>
	</head>

	<body>
		<form>
			<label for="Full_Name">Full Name:</label>
			<input type="text" name="full name" id="Full_Name" required>
			<br>

			<label for="email">Email:</label>
			<input type="email" name="email" id="email"required>
			<br>

			<label for="Password">Password:</label>
			<input type="password" name="password" id="Password" minlength=8 required>
			<br>

			Gender:
			<br>
			<label for="male">Male</label><input type="radio" name="gender" id="male" value="Male">
			<label for="female">Female</label><input type="radio" name="gender" id="female" value="Female">
			<br>

			<label for="country">Country:</label>
			<select id="country" name="country">
				<option value="">--Choose an option--</option>
				<option value="jo">Jordan</option>
				<option value="USA">USA</option>
				<option value="UK">UK</option>
			</select>
			<br>

			<label for="message">Additional Message</label><br>
			<textarea id="message" name="message" rows="3" cols="40" placeholder="Type your message here..."></textarea>
		
			<br><button type="submit">Submit</button>
		</form>
	</body>
</html>
